name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      # gradle.properties points org.gradle.java.home at a Windows path
      # (C:\Program Files\Android\Android Studio\jbr). That breaks on Linux CI,
      # so drop it here; CI uses the JDK 17 set up above.
      - name: Remove Windows-only JDK path
        run: sed -i '/^org.gradle.java.home=/d' gradle.properties

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Droidbubble-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
